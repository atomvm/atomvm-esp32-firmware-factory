# Build every image of the matrix for one AtomVM commit and upload each bundle
# to a draft release created by the caller, then check that the draft holds
# exactly the expected bundles. Publishing the draft is left to the caller.

name: build

on:
  workflow_call:
    inputs:
      version:
        description: Version component of the image names (channel or tag)
        required: true
        type: string
      atomvm_sha:
        required: true
        type: string
      atomgl_sha:
        required: true
        type: string
      build_date:
        description: Build date, yyyymmdd
        required: true
        type: string
      stamp:
        description: ESP-IDF app version (CONFIG_APP_PROJECT_VER)
        required: true
        type: string
      release_id:
        description: Id of the draft release receiving the bundles
        required: true
        type: string

env:
  ATOMVM_REPO: atomvm/AtomVM
  ATOMGL_REPO: atomvm/atomgl
  EXPECTED_ASSETS: "2"

jobs:
  build:
    runs-on: ubuntu-24.04
    container: espressif/idf:v5.5.4
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - chip: esp32s3
            features: atomgl ipv6 libsodium psram
            elixir: false
            name: AtomVM-esp32s3-atomgl-ipv6-libsodium-psram
          - chip: esp32s3
            features: atomgl ipv6 libsodium psram
            elixir: true
            name: AtomVM-esp32s3-atomgl-ipv6-libsodium-psram-elixir
    env:
      # as upstream esp32-mkimage.yaml: host compiler for the libs build,
      # ImageOS lets erlef/setup-beam run inside the container
      CC: clang-14
      CXX: clang++-14
      CFLAGS: -O3
      CXXFLAGS: -O3
      ImageOS: ubuntu24
      LC_ALL: C.UTF-8
      LANG: C.UTF-8
      CHIP: ${{ matrix.chip }}
      FEATURES: ${{ matrix.features }}
      ELIXIR: ${{ matrix.elixir }}
      STEM: ${{ matrix.name }}-${{ inputs.version }}
      ESP32_DIR: AtomVM/src/platforms/esp32
      RELEASE_ID: ${{ inputs.release_id }}
      ATOMVM_SHA: ${{ inputs.atomvm_sha }}
      ATOMGL_SHA: ${{ inputs.atomgl_sha }}
      BUILD_DATE: ${{ inputs.build_date }}
      STAMP: ${{ inputs.stamp }}
    steps:
      - name: Checkout factory
        uses: actions/checkout@v4
        with:
          path: factory

      - name: Checkout AtomVM
        uses: actions/checkout@v4
        with:
          repository: ${{ env.ATOMVM_REPO }}
          ref: ${{ inputs.atomvm_sha }}
          path: AtomVM

      - name: Checkout atomgl
        if: contains(matrix.features, 'atomgl')
        uses: actions/checkout@v4
        with:
          repository: ${{ env.ATOMGL_REPO }}
          ref: ${{ inputs.atomgl_sha }}
          path: AtomVM/src/platforms/esp32/components/atomgl

      - uses: erlef/setup-beam@v1
        with:
          otp-version: "28"
          elixir-version: "1.19"
          rebar3-version: "3.25.1"
          hexpm-mirrors: |
            https://builds.hex.pm
            https://repo.hex.pm
            https://cdn.jsdelivr.net/hex

      - name: Install host dependencies
        run: |
          apt-get update -y
          DEBIAN_FRONTEND=noninteractive apt-get install -y clang-14 git cmake gperf zlib1g-dev jq
          # the checkouts are owned by another uid; AtomVM's CMake needs git rev-parse to work
          git config --global --add safe.directory '*'

      - name: Build AtomVM libraries (host side)
        working-directory: AtomVM
        run: |
          mkdir -p build
          cd build
          cmake ..
          cd libs
          make
          ls -l esp32boot/

      - name: Prepare sdkconfig and components
        working-directory: ${{ env.ESP32_DIR }}
        run: |
          cp sdkconfig.release-defaults.in sdkconfig.defaults.in
          fragments=()
          for feature in $FEATURES; do
            if [ -f "$GITHUB_WORKSPACE/factory/features/$feature.sdkconfig" ]; then
              fragments+=("$GITHUB_WORKSPACE/factory/features/$feature.sdkconfig")
            fi
          done
          python3 "$GITHUB_WORKSPACE/factory/scripts/apply_fragments.py" sdkconfig.defaults.in \
            --set CONFIG_APP_PROJECT_VER_FROM_CONFIG=y \
            --set "CONFIG_APP_PROJECT_VER=\"$STAMP\"" \
            "${fragments[@]}"
          echo "::group::sdkconfig.defaults.in"
          cat sdkconfig.defaults.in
          echo "::endgroup::"
          case " $FEATURES " in
            *" libsodium "*)
              . "$IDF_PATH/export.sh"
              idf.py add-dependency "espressif/libsodium^1.0.20~4"
              cat main/idf_component.yml
              ;;
          esac

      - name: Build firmware
        id: build
        working-directory: ${{ env.ESP32_DIR }}
        run: |
          . "$IDF_PATH/export.sh"
          elixir=off
          if [ "$ELIXIR" = "true" ]; then elixir=on; fi
          flags=("-DATOMVM_ELIXIR_SUPPORT=$elixir" -DATOMVM_DEV=ON "-DATOMVM_BUILD_METADATA=$BUILD_DATE")
          case " $FEATURES " in
            *" libsodium "*) flags+=(-DAVM_USE_LIBSODIUM=ON) ;;
          esac
          # With PSRAM enabled on the ESP32 and ESP32-S3, ESP-IDF compiles everything
          # with -mdisable-hardware-atomics (CONFIG_STDATOMIC_S32C1I_SPIRAM_WORKAROUND:
          # the S32C1I instruction cannot operate on PSRAM) and provides C11 atomics
          # in software. Since ESP-IDF 5.5 that flag is visible to AtomVM's
          # configure-time check for lock-free atomics, which then fails, although
          # the same software atomics worked with ESP-IDF 5.4 (HAVE_ATOMIC path).
          # Pre-seed the check result so that path keeps being used. Drop this once
          # upstream accepts ESP-IDF's software atomics in that check.
          case "$CHIP" in
            esp32|esp32s3)
              case " $FEATURES " in
                *" psram "*|*" octalpsram "*) flags+=(-DATOMIC_POINTER_LOCK_FREE_IS_TWO=1) ;;
              esac
              ;;
          esac
          "$GITHUB_WORKSPACE/factory/scripts/build_esp32.sh" "$CHIP" "${flags[@]}"

      - name: Collect configure and build logs
        if: failure()
        working-directory: ${{ env.ESP32_DIR }}
        run: |
          diag="$GITHUB_WORKSPACE/diag"
          mkdir -p "$diag"
          cp -r build/log "$diag/idf-log" 2>/dev/null || true
          cp build/CMakeFiles/CMakeConfigureLog.yaml build/toolchain/cflags build/toolchain/cxxflags \
             sdkconfig sdkconfig.defaults sdkconfig.defaults.in build.log "$diag/" 2>/dev/null || true
          # compiler output of every failed configure-time check
          if [ -f build/CMakeFiles/CMakeConfigureLog.yaml ]; then
            python3 - <<'PY'
          import re, yaml
          log = yaml.safe_load(open("build/CMakeFiles/CMakeConfigureLog.yaml"))
          for event in log.get("events", []):
              result = event.get("buildResult") or {}
              if event.get("kind", "").startswith("try_compile") and result.get("exitCode", 0) != 0:
                  print("::group::failed check", result.get("variable"), event.get("checks"))
                  print("C flags:", (event.get("cmakeVariables") or {}).get("CMAKE_C_FLAGS"))
                  print(result.get("stdout", ""))
                  print("::endgroup::")
          PY
          fi
          echo "diag-dir=$diag" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: diag-${{ matrix.name }}-${{ inputs.version }}
          path: diag/
          if-no-files-found: ignore

      - name: Create image
        working-directory: ${{ env.ESP32_DIR }}/build
        run: |
          ./mkimage.sh
          flavor=""
          if [ "$ELIXIR" = "true" ]; then flavor="-elixir"; fi
          mv "atomvm-$CHIP$flavor.img" "$STEM.img"
          ls -l "$STEM.img"

      - name: Assemble and verify bundle
        working-directory: ${{ env.ESP32_DIR }}
        run: |
          epoch=$(date -u -d "$BUILD_DATE" +%s)
          python3 "$GITHUB_WORKSPACE/factory/scripts/make_bundle.py" \
            --stem "$STEM" --chip "$CHIP" --img "build/$STEM.img" --sdkconfig sdkconfig \
            --partitions-dir . --build-dir build \
            --source-date-epoch "$epoch" --out "$GITHUB_WORKSPACE/dist"
          escript "$GITHUB_WORKSPACE/factory/scripts/verify_bundle.escript" "$GITHUB_WORKSPACE/dist/$STEM.zip" "$STEM"
          unzip -l "$GITHUB_WORKSPACE/dist/$STEM.zip"
          echo "::group::FLASH.txt"
          unzip -p "$GITHUB_WORKSPACE/dist/$STEM.zip" FLASH.txt
          echo "::endgroup::"

      - name: Upload bundle to the draft release
        id: upload
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          api="https://api.github.com/repos/$GITHUB_REPOSITORY"
          auth=(-H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28")
          asset="$STEM.zip"
          local_sha=$(sha256sum "$asset" | cut -d' ' -f1)
          # drop a same-named asset left by a previous attempt of this run
          curl -fsS "${auth[@]}" "$api/releases/$RELEASE_ID/assets?per_page=100" \
            | jq -r --arg name "$asset" '.[] | select(.name == $name) | .id' \
            | while read -r id; do
                echo "deleting previous asset $id"
                curl -fsS -X DELETE "${auth[@]}" "$api/releases/assets/$id"
              done
          asset_id=$(curl -fsS -X POST "${auth[@]}" -H "Content-Type: application/zip" \
                       --data-binary "@$asset" \
                       "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets?name=$asset" \
                     | jq -r .id)
          echo "uploaded $asset as asset $asset_id"
          digest=null
          for attempt in $(seq 1 10); do
            digest=$(curl -fsS "${auth[@]}" "$api/releases/assets/$asset_id" | jq -r '.digest // "null"')
            if [ "$digest" != "null" ]; then break; fi
            echo "digest not available yet (attempt $attempt)"
            sleep 3
          done
          echo "local  sha256:$local_sha"
          echo "github $digest"
          if [ "$digest" != "sha256:$local_sha" ]; then
            echo "::error::asset digest mismatch or unavailable"
            exit 1
          fi
          {
            echo "sha256=$local_sha"
            echo "size=$(stat -c %s "$asset")"
          } >> "$GITHUB_OUTPUT"

      - name: Record build metadata
        env:
          OPTIMIZATION: ${{ steps.build.outputs.optimization }}
          SHA256: ${{ steps.upload.outputs.sha256 }}
          SIZE: ${{ steps.upload.outputs.size }}
        run: |
          . "$IDF_PATH/export.sh" >/dev/null
          idf_version=$(idf.py --version | tail -n1)
          elf_sha256=$(sha256sum "$ESP32_DIR/build/atomvm-esp32.elf" | cut -d' ' -f1)
          mkdir -p meta
          jq -n \
            --arg stem "$STEM" --arg chip "$CHIP" --arg features "$FEATURES" --arg elixir "$ELIXIR" \
            --arg optimization "$OPTIMIZATION" --arg sha256 "$SHA256" --arg size "$SIZE" \
            --arg atomvm_sha "$ATOMVM_SHA" --arg atomgl_sha "$ATOMGL_SHA" \
            --arg idf_version "$idf_version" --arg stamp "$STAMP" --arg elf_sha256 "$elf_sha256" \
            '{stem: $stem, chip: $chip, features: $features, elixir: ($elixir == "true"),
              optimization: $optimization, sha256: $sha256, size: ($size | tonumber),
              atomvm_sha: $atomvm_sha, atomgl_sha: $atomgl_sha, idf_version: $idf_version, stamp: $stamp,
              elf_sha256: $elf_sha256}' \
            > "meta/$STEM.json"
          cat "meta/$STEM.json"

      - uses: actions/upload-artifact@v4
        with:
          name: meta-${{ matrix.name }}-${{ inputs.version }}
          path: meta/
          if-no-files-found: error

  check:
    needs: build
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_ID: ${{ inputs.release_id }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: meta-*
          path: meta
          merge-multiple: true

      - name: Check the draft is complete
        run: |
          gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets?per_page=100" --jq '.[].name' | sort > assets.txt
          jq -r '.stem + ".zip"' meta/*.json | sort > expected.txt
          echo "assets on the draft:"; cat assets.txt
          count=$(wc -l < assets.txt)
          if [ "$count" != "$EXPECTED_ASSETS" ] || ! cmp -s assets.txt expected.txt; then
            echo "::error::draft holds $count asset(s), expected $EXPECTED_ASSETS matching the built images; nothing published"
            diff assets.txt expected.txt || true
            exit 1
          fi
