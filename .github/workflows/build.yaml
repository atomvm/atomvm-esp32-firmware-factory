# Build the given images for one AtomVM commit and upload each bundle to a
# draft release created by the caller, then check that the draft holds exactly
# the expected bundles. Publishing the draft is left to the caller. One job
# builds all the images of a chip, one after the other: the job setup is paid
# once per chip, and each Elixir image, whose firmware is identical to the
# image before it, is compiled from ccache.

name: build

on:
  workflow_call:
    inputs:
      version:
        description: Version component of the image names (channel or tag)
        required: true
        type: string
      atomvm_sha:
        required: true
        type: string
      atomgl_sha:
        required: true
        type: string
      build_date:
        description: Build date, yyyymmdd
        required: true
        type: string
      stamp:
        description: ESP-IDF app version (CONFIG_APP_PROJECT_VER)
        required: true
        type: string
      release_id:
        description: Id of the draft release receiving the bundles
        required: true
        type: string
      images:
        description: The images to build, grouped by chip, as printed by scripts/images.py
        required: true
        type: string

env:
  ATOMVM_REPO: atomvm/AtomVM
  ATOMGL_REPO: atomvm/atomgl

jobs:
  build:
    name: ${{ matrix.chip }}
    runs-on: ubuntu-24.04
    container: espressif/idf:v5.5.4
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.images) }}
    env:
      # as upstream esp32-mkimage.yaml: host compiler for the libs build,
      # ImageOS lets erlef/setup-beam run inside the container
      CC: clang-14
      CXX: clang++-14
      CFLAGS: -O3
      CXXFLAGS: -O3
      ImageOS: ubuntu24
      LC_ALL: C.UTF-8
      LANG: C.UTF-8
      VERSION: ${{ inputs.version }}
      ESP32_DIR: AtomVM/src/platforms/esp32
      RELEASE_ID: ${{ inputs.release_id }}
      ATOMVM_SHA: ${{ inputs.atomvm_sha }}
      ATOMGL_SHA: ${{ inputs.atomgl_sha }}
      BUILD_DATE: ${{ inputs.build_date }}
      STAMP: ${{ inputs.stamp }}
    steps:
      - name: Checkout factory
        uses: actions/checkout@v4
        with:
          path: factory

      - name: Checkout AtomVM
        uses: actions/checkout@v4
        with:
          repository: ${{ env.ATOMVM_REPO }}
          ref: ${{ inputs.atomvm_sha }}
          path: AtomVM

      - name: Checkout atomgl
        if: contains(toJSON(matrix.images), 'atomgl')
        uses: actions/checkout@v4
        with:
          repository: ${{ env.ATOMGL_REPO }}
          ref: ${{ inputs.atomgl_sha }}
          path: atomgl

      - uses: erlef/setup-beam@v1
        with:
          otp-version: "28"
          elixir-version: "1.19"
          rebar3-version: "3.25.1"
          hexpm-mirrors: |
            https://builds.hex.pm
            https://repo.hex.pm
            https://cdn.jsdelivr.net/hex

      - name: Install host dependencies
        run: |
          apt-get update -y
          DEBIAN_FRONTEND=noninteractive apt-get install -y clang-14 git cmake gperf zlib1g-dev jq
          # the checkouts are owned by another uid; AtomVM's CMake needs git rev-parse to work
          git config --global --add safe.directory '*'

      - name: Build AtomVM libraries (host side)
        working-directory: AtomVM
        run: |
          mkdir -p build
          cd build
          cmake ..
          cd libs
          make
          ls -l esp32boot/

      - name: Build the images
        working-directory: ${{ env.ESP32_DIR }}
        env:
          IMAGES: ${{ toJSON(matrix.images) }}
        run: |
          # every image is attempted, so one run reports all failures
          failed=()
          while read -r entry; do
            name=$(jq -r .name <<< "$entry")
            echo "==== $name"
            # start from the checkout: drop the previous image's build, config and components
            git clean -xffdq .
            git checkout -- .
            case " $(jq -r .features <<< "$entry") " in
              *" atomgl "*) cp -a "$GITHUB_WORKSPACE/atomgl" components/atomgl ;;
            esac
            if ! OUT="$GITHUB_WORKSPACE/dist" DIAG="$GITHUB_WORKSPACE/diag" \
                "$GITHUB_WORKSPACE/factory/scripts/build_image.sh" "$entry"; then
              echo "::error::$name failed"
              failed+=("$name")
            fi
          done < <(jq -c '.[]' <<< "$IMAGES")
          if [ "${#failed[@]}" -gt 0 ]; then
            echo "::error::failed images: ${failed[*]}"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: diag-${{ matrix.chip }}-${{ inputs.version }}
          path: diag/
          if-no-files-found: ignore

      - name: Upload the bundles to the draft release
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          api="https://api.github.com/repos/$GITHUB_REPOSITORY"
          auth=(-H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28")
          for asset in *.zip; do
            local_sha=$(sha256sum "$asset" | cut -d' ' -f1)
            # drop a same-named asset left by a previous attempt of this run
            curl -fsS "${auth[@]}" "$api/releases/$RELEASE_ID/assets?per_page=100" \
              | jq -r --arg name "$asset" '.[] | select(.name == $name) | .id' \
              | while read -r id; do
                  echo "deleting previous asset $id"
                  curl -fsS -X DELETE "${auth[@]}" "$api/releases/assets/$id"
                done
            asset_id=$(curl -fsS -X POST "${auth[@]}" -H "Content-Type: application/zip" \
                         --data-binary "@$asset" \
                         "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets?name=$asset" \
                       | jq -r .id)
            echo "uploaded $asset as asset $asset_id"
            digest=null
            for attempt in $(seq 1 10); do
              digest=$(curl -fsS "${auth[@]}" "$api/releases/assets/$asset_id" | jq -r '.digest // "null"')
              if [ "$digest" != "null" ]; then break; fi
              echo "digest not available yet (attempt $attempt)"
              sleep 3
            done
            echo "local  sha256:$local_sha"
            echo "github $digest"
            if [ "$digest" != "sha256:$local_sha" ]; then
              echo "::error::$asset: asset digest mismatch or unavailable"
              exit 1
            fi
          done

      - uses: actions/upload-artifact@v4
        with:
          name: meta-${{ matrix.chip }}-${{ inputs.version }}
          path: dist/*.json
          if-no-files-found: error

  check:
    needs: build
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_ID: ${{ inputs.release_id }}
      IMAGES: ${{ inputs.images }}
      VERSION: ${{ inputs.version }}
    steps:
      - name: Check the draft is complete
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets?per_page=100" --jq '.[].name' | sort > assets.txt
          jq -r --arg version "$VERSION" '.[].images[] | "\(.name)-\($version).zip"' <<< "$IMAGES" | sort > expected.txt
          echo "assets on the draft:"; cat assets.txt
          if ! cmp -s assets.txt expected.txt; then
            echo "::error::draft holds $(wc -l < assets.txt) asset(s), expected the $(wc -l < expected.txt) images to build; nothing published"
            diff assets.txt expected.txt || true
            exit 1
          fi
